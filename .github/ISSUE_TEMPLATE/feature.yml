name: ✨ Feature Request
description: 機能リクエスト / Request a new feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 新機能の提案ありがとうございます
        Thanks for suggesting a new feature.
  - type: input
    id: repo
    attributes:
      label: 対象リポジトリ / Target Repository
      placeholder: e.g., shell, pool, agents
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題 / Problem
      description: 何が困ってるか / What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposed Solution
      description: どう解決したいか / How would you like it solved?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / Alternatives Considered
  - type: textarea
    id: context
    attributes:
      label: 補足 / Additional Context
      description: スクリーンショット、参考リンク等 / Screenshots, related links, etc.
