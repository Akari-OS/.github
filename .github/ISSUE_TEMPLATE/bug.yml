name: 🐛 Bug Report
description: バグ報告 / Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## バグ報告ありがとうございます
        Thanks for reporting a bug. Please fill in the details below.
  - type: input
    id: repo
    attributes:
      label: 影響リポジトリ / Affected Repository
      description: どのリポで発生したか / Which repo (e.g., pool, video, shell)
      placeholder: e.g., pool
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 概要 / Description
      description: バグの内容を簡潔に / What's the bug?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順 / Steps to Reproduce
      description: どうすれば再現できるか / How to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作 / Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作 / Actual Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境 / Environment
      value: |
        - OS:
        - Version:
        - Node / Rust version (if applicable):
  - type: textarea
    id: logs
    attributes:
      label: ログ / Logs
      render: shell
